name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The QA environment (its own Cloud Run + Supabase project + the deployed-QA Playwright
      # jobs) was dropped for cost - mirrors organize-me's 2026-09-08 `refactor: drop QA
      # environment from the pipeline`. event-creator's only migration is a no-op baseline (it
      # adopts tables organize-me's schema-separation migration created), so there's no schema to
      # stand up on a throwaway Postgres - the pytest/alembic run points at Supabase prod, exactly
      # as deploy.yml's own `test` job already does on every merge to main. Tests roll every write
      # back inside a SAVEPOINT (see tests/conftest.py), so nothing is persisted.
      DATABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
      # Slice R7 storage-connect OAuth tests build real consent URLs/exchange calls against fakes,
      # but assert the client_id/secret actually configured flows through - same secrets as
      # organize-me's own ci.yml (mirrors that repo's test job), reused here since these are the
      # same registered Google/Dropbox OAuth apps, just with this service's own redirect URI added
      # as an additional authorized callback in each app's console.
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      # Fixed per-environment value (issue #200), not a secret. tests/conftest.py monkeypatches
      # its own value for the redirect-URI assertions regardless - this is only here for parity
      # with deploy.yml's test job.
      GOOGLE_DRIVE_REDIRECT_URI: https://organizeme.russcoopersoftware.com/api/v1/storage-config/google-drive/callback
      DROPBOX_OAUTH_CLIENT_ID: ${{ secrets.DROPBOX_OAUTH_CLIENT_ID }}
      DROPBOX_OAUTH_CLIENT_SECRET: ${{ secrets.DROPBOX_OAUTH_CLIENT_SECRET }}
      DROPBOX_OAUTH_REDIRECT_URI: https://organizeme.russcoopersoftware.com/api/v1/storage-config/dropbox/callback
      # Storage-credential encryption key. Tests inject their own throwaway keys regardless, so
      # this has no effect on pass/fail - set for parity with organize-me's own ci.yml.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      # Gemini pipeline calls moved here in R11, but this was never wired in until now (found live
      # in prod as "Gemini call failed: GEMINI_API_KEY is not set" - tests mock the Gemini client,
      # so its absence was invisible to CI). Same key as organize-me's own GEMINI_API_KEY secret.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Processing-run notifications (email + SMS) moved here in R8/R11 alongside the rest of the
      # pipeline, but RESEND_API_KEY/TWILIO_* were never wired in - same class of gap as
      # GEMINI_API_KEY above, just not caught yet because tests mock both senders. Same secrets as
      # organize-me's own ci.yml.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --group build

      - name: Build Tailwind CSS
        run: uv run python scripts/build_css.py

      - name: Verify compiled CSS is non-empty and contains the canary utility class
        run: uv run python scripts/verify_css_build.py

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

      - name: Run mypy
        run: uv run mypy app tests
